# ------------------------------------------------------------------------------
# CI minimale : ce dépôt ne doit jamais laisser passer un secret.
#
# Deux contrôles, dans l'ordre d'importance :
#   1. gitleaks  — détecte un secret dans le commit ET dans tout l'historique
#   2. validate  — YAML, schémas Kubernetes, anti-patterns RBAC
#
# Aucun déploiement : ce workflow est un garde-fou, pas un pipeline CD.
# ------------------------------------------------------------------------------
name: validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: "gitleaks — aucun secret dans le dépôt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # historique complet : indispensable
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifests:
    name: "manifests — YAML, schémas, anti-patterns"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          python3 -m pip install --quiet pyyaml
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Validation
        run: make validate

  shellcheck:
    name: "scripts — shellcheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh
