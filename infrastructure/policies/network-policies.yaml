# ─────────────────────────────────────────────────────── 3. frontend -> backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-to-backend
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
          podSelector:
            matchLabels:
              app.kubernetes.io/name: api-backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress-from-frontend
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-backend
  policyTypes: ["Ingress"]
  ingress:
    # Trafic du frontend uniquement (nom + label de namespace cumulés)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend
          podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8080
    # Trafic de sondes/scraping depuis le namespace security (démonstration)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
      ports:
        - protocol: TCP
          port: 8080

# ─────────────────────────────────────────────────── 4. backend -> PostgreSQL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-to-postgres
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-backend
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # API Kubernetes, nécessaire UNIQUEMENT pour la démo 2 (kubectl depuis le
    # Pod). En production : supprimer cette règle et passer
    # automountServiceAccountToken à false. Le Role RBAC devient alors inutile
    # côté Pod, ce qui est l'état le plus sûr.
    # Remplacer 0.0.0.0/0 par l'endpoint réel de l'API server en production.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    # Seuls deux clients légitimes : le backend (applicatif) et Vault
    # (moteur database, pour créer les rôles jetables).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 5432

# ────────────────────────────────────────────── 5. Vault : qui peut y entrer ?
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: ["Ingress"]
  ingress:
    # SEUL External Secrets Operator peut parler à Vault sur 8200.
    # Le backend en est exclu : c'est la preuve réseau du blast radius.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
    # Job de bootstrap (même namespace vault)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-bootstrap
      ports:
        - protocol: TCP
          port: 8200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-egress
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: ["Egress"]
  egress:
    # 1. PostgreSQL : indispensable au moteur `database` (dynamic secrets)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
    # 2. API Kubernetes : TokenReview pour valider les JWT des clients
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eso-egress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes: ["Egress"]
  egress:
    # Vault, et rien d'autre côté applicatif
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
    # API Kubernetes (création/mise à jour des Secrets cibles)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
