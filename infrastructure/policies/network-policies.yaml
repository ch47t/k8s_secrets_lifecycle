# ──────────────────────────────────────────────────────────────────────────────
# NetworkPolicies — deuxième ligne de défense (blast radius, partie 6)
#
# Le RBAC contrôle « qui peut lire quoi dans l'API ». Il ne dit RIEN du trafic
# réseau : un Pod backend compromis pourrait sinon contacter Vault en direct
# et contourner RBAC/ESO. Ces politiques rendent cette phrase vraie :
#   « Peut-il contacter Vault directement ? — Non. »
#
# ⚠️  ATTENTION — un objet NetworkPolicy n'est qu'une intention : il n'est
#     appliqué que si le CNI l'implémente. kindnet (CNI par défaut de kind)
#     n'applique pas les politiques sur toutes les versions. Deux options :
#       make install-calico   # CNI qui applique réellement les politiques
#       make netpol-check     # vérifie par la preuve (test négatif + contrôle)
#     Ce point est documenté dans docs/06-analyse-compromission.md comme
#     limite résiduelle : c'est exactement le genre d'honnêteté attendue.
# ──────────────────────────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────────── 1. deny all# Un default-deny par namespace : tout ce qui n'est pas explicitement autorisé
# est refusé. C'est l'inverse du modèle Kubernetes par défaut (tout ouvert).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: backend
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: frontend
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: database
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: vault
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

# ───────────────────────────────────────────────────────── 2. DNS (toujours)# Sans cette règle, la résolution de noms casse et tout le reste avec elle :
# c'est l'erreur n°1 des débuts en NetworkPolicy.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: backend
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: frontend
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
