# ──────────────────────────────────────────────────────────────────────────────
# ClusterSecretStore — le pont contrôlé entre Vault et les namespaces
#
# Pourquoi un ClusterSecretStore et pas un SecretStore par namespace ?
#   - Un SecretStore est namespacé : il faudrait dupliquer la config Vault
#     dans backend ET database, et un ExternalSecret ne peut référencer qu'un
#     SecretStore de SON namespace.
#   - Un ClusterSecretStore est unique et réutilisable, MAIS il est visible de
#     tous les namespaces. C'est là que le bloc `conditions` intervient : il
#     restreint l'usage aux namespaces explicitement autorisés. Sans ce bloc,
#     n'importe quel namespace pourrait créer un ExternalSecret pointant vers
#     Vault avec les droits d'ESO — c'est la faille classique de ce pattern.
#
# Authentification : auth Kubernetes (pas de token statique stocké nulle part).
# ESO projette le JWT du ServiceAccount sa-eso, Vault le valide via
# TokenReview, et le role `eso` ne l'accepte que si nom + namespace matchent.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
spec:
  # Seuls ces namespaces peuvent consommer ce store.
  # kubernetes.io/metadata.name est ajouté automatiquement par K8s >= 1.21.
  conditions:
    - namespaces:
        - backend
        - database
      # Le nom de namespace n'est pas deviné : on exige AUSSI le label
      # standard kubernetes.io/metadata.name. Un namespace recréé par un
      # attaquant sous le même nom ne suffit pas à obtenir l'accès.
      namespaceSelector:
        matchLabels:
          app.kubernetes.io/part-of: secrets-lifecycle
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret            # préfixe KV
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: sa-eso
            namespace: external-secrets
            # L'audience doit correspondre à bound_audiences du role Vault
            audiences:
              - vault
