# ──────────────────────────────────────────────────────────────────────────────
# ExternalSecrets — la déclaration « quel secret Vault -> quel Secret K8s »
#
# refreshInterval: 30s  => ESO revérifie Vault toutes les 30 secondes.
#   C'est CE paramètre qui rend la rotation non intrusive : un changement
#   dans Vault se propage en <= 30 s, sans redéploiement ni intervention.
#   (La doc du projet mentionne 60 s ; 30 s rend la démo plus lisible.)
#
# creationPolicy: Owner
#   Le Secret Kubernetes est possédé par l'ExternalSecret : supprimer
#   l'ExternalSecret supprime le Secret. Pas de secret orphelin qui traîne.
#
# deletionPolicy: Retain/Delete
#   Retain ici pour la base de données : si ESO disparaît, PostgreSQL ne perd
#   pas son mot de passe en pleine exécution. Choix argumenté dans le rapport.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: backend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials        # nom EXACT attendu par le Role RBAC
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Format lisible + un fichier .env-like pour les clients qui en veulent
        username: "{{ .username }}"
        password: "{{ .password }}"
        host: "{{ .host }}"
        port: "{{ .port }}"
        database: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: backend/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: backend/db-credentials
        property: password
    - secretKey: host
      remoteRef:
        key: backend/db-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: backend/db-credentials
        property: port
    - secretKey: database
      remoteRef:
        key: backend/db-credentials
        property: database
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-key
  namespace: backend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jwt-key
    creationPolicy: Owner
  data:
    - secretKey: signing-key
      remoteRef:
        key: backend/jwt-key
        property: signing-key
    - secretKey: algorithm
      remoteRef:
        key: backend/jwt-key
        property: algorithm
---
# Ce secret existe dans le namespace backend, mais sa-backend n'a PAS le droit
# de le lire (resourceNames ne le liste pas). Il sert la démo 2 : le Pod
# api-backend ne peut pas lire un secret qui est pourtant dans son namespace.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-api-key
  namespace: backend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: external-api-key
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: backend/external-api-key
        property: value
---
# PostgreSQL a besoin de son mot de passe, et seulement de celui-là.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: database
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain       # ne pas casser la base si ESO disparaît
  data:
    - secretKey: username
      remoteRef:
        key: database/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: database/db-credentials
        property: password
    - secretKey: database
      remoteRef:
        key: database/db-credentials
        property: database
