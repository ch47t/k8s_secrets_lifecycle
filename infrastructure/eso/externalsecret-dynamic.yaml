# ──────────────────────────────────────────────────────────────────────────────
# (Optionnel, démo 5b) Credentials PostgreSQL DYNAMIQUES via Vault
#
# Différence fondamentale avec le secret statique ci-dessus :
#   - statique  : une valeur, identique pour tous, jusqu'à rotation manuelle
#   - dynamique : Vault CRÉE un utilisateur PostgreSQL jetable à la demande
#                 (TTL 5 min), puis le DÉTRUIT automatiquement (DROP ROLE)
#
# Conséquence : il n'y a plus rien à « faire tourner ». Le credential existe
# déjà avec une durée de vie courte. C'est la réponse à la limite « un secret
# statique est un secret compromis en attente » de la partie 4.
#
# Ce fichier est séparé et NON déployé par défaut, car PostgreSQL doit avoir
# la table/les droits nécessaires et le TTL de 5 min provoque des coupures si
# l'application met le secret en cache. À activer explicitement :
#   kubectl apply -f infrastructure/eso/externalsecret-dynamic.yaml
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-dynamic-credentials
  namespace: backend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
    app.kubernetes.io/component: demo-dynamic
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-dynamic-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: database/creds/app
        property: username
    - secretKey: password
      remoteRef:
        key: database/creds/app
        property: password
