# ──────────────────────────────────────────────────────────────────────────────
# Architecture des identités (partie 3 du plan)
#
# Chaque workload tourne avec son propre ServiceAccount. Le ServiceAccount
# EST l'identité du workload : le lier à un namespace différent du sien, ou
# réutiliser `default`, revient à donner les mêmes droits à tout le monde.
#
# automountServiceAccountToken :
#   - false  => le Pod ne peut même pas parler à l'API Kubernetes. Le secret
#              monté en volume reste lisible (c'est le kubelet qui le fournit,
#              pas l'API). C'est le réglage le plus sûr.
#   - true   => nécessaire UNIQUEMENT si le Pod appelle l'API (démo 2, ESO).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-backend
  namespace: backend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
# true : le Pod api-backend interroge l'API dans la démo d'accès autorisé.
# En production stricte, passer à false et supprimer le Role ci-dessous.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-frontend
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-database
  namespace: database
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
automountServiceAccountToken: false
---
# ServiceAccount utilisé par External Secrets Operator pour s'authentifier
# auprès de Vault (auth Kubernetes : projeté comme JWT dans le SecretStore).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-eso
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
---
# ServiceAccount du Pod « attaquant » de la démo 1 : aucun droit, aucun Role.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-intrus
  namespace: security
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
