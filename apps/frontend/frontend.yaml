# ──────────────────────────────────────────────────────────────────────────────
# frontend — le composant qui ne doit RIEN savoir des secrets
#
# Ce Deployment ne monte aucun Secret et son ServiceAccount a
# automountServiceAccountToken: false. Il ne parle qu'au Service api-backend
# via le réseau (proxy nginx). Si ce Pod est compromis, l'attaquant n'obtient
# aucun credential : c'est la démonstration du moindre privilège à l'échelle
# de l'architecture (Partie 3 : « sa-frontend : aucun accès aux Secrets »).
#
# nginx-unprivileged : écoute sur 8080, pas besoin de root ni de NET_BIND_SERVICE.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <title>Mini-projet 6 — Cycle de vie des secrets</title>
      <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0;
               background: #0f172a; color: #e2e8f0; }
        main { max-width: 820px; margin: 0 auto; padding: 48px 24px; }
        h1 { font-size: 22px; letter-spacing: -.01em; }
        h1 span { color: #38bdf8; }
        .card { background: #1e293b; border: 1px solid #334155;
                border-radius: 10px; padding: 18px 20px; margin: 16px 0; }
        code { background: #0f172a; padding: 2px 6px; border-radius: 4px;
               color: #7dd3fc; font-size: 13px; }
        ul { line-height: 1.9; padding-left: 20px; }
        .muted { color: #94a3b8; font-size: 13px; }
        pre { background: #0f172a; padding: 14px; border-radius: 8px;
              overflow-x: auto; font-size: 12px; color: #94a3b8; }
      </style>
    </head>
    <body>
      <main>
        <h1>Sécurisation du cycle de vie des <span>secrets</span> — Kubernetes</h1>
        <div class="card">
          <p>Le frontend ne détient <strong>aucun secret</strong>.
             Son ServiceAccount n'a aucune permission et il ne monte
             aucun volume secret.</p>
          <p class="muted">Il ne parle qu'à l'API backend, qui elle-même lit
             ses secrets depuis un volume monté, alimenté par Vault via
             External Secrets Operator.</p>
        </div>
        <div class="card">
          <p><strong>Endpoints de démonstration proxifiés</strong></p>
          <ul>
            <li><code>GET /api/db-check</code> — connexion PostgreSQL avec le mot de passe courant</li>
            <li><code>GET /api/secret-fingerprint</code> — empreintes SHA-256 des secrets (preuve de rotation)</li>
            <li><code>GET /api/whoami</code> — Pod, ServiceAccount et secrets montés</li>
          </ul>
          <pre id="out">chargement…</pre>
        </div>
        <script>
          fetch('/api/secret-fingerprint')
            .then(r => r.json())
            .then(j => { document.getElementById('out').textContent = JSON.stringify(j, null, 2); })
            .catch(e => { document.getElementById('out').textContent = 'API indisponible: ' + e; });
        </script>
      </main>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: secrets-lifecycle
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location / {
        root   /usr/share/nginx/html;
        index  index.html;
      }

      # Le frontend ne connaît que le nom du Service backend.
      # Aucun credential ne transite par ici.
      location /api/ {
        proxy_pass         http://api-backend.backend.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: secrets-lifecycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: secrets-lifecycle
    spec:
      serviceAccountName: sa-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: frontend-html
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort        # exposé sur localhost:8080 via kind extraPortMappings
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
